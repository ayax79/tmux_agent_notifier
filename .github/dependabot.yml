version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
